clock:
  timezone: "America/New_York"
  display_format: "12hr"   # 12hr or 24hr
  show_seconds: true
  seconds_scale: 0.55       # seconds font size relative to main time (0.0–1.0)
  font: "Exo 2"          # Orbitron | Share Tech Mono | Rajdhani | Exo 2 | Michroma | Audiowide
  size_scale: 1.0           # clock digit size multiplier, 0.5–2.0 (1.0 = default size)
  color_day: "#e8a020"      # digit/accent color while ambient light is bright (day mode)
  color_night: "#c0392b"    # digit/accent color at night (low ambient light via BH1750;
                             # switch uses display.dim_low_lux / display.dim_high_lux as hysteresis)

display:
  auto_dim: true
  dim_min_brightness: 30   # % brightness floor at night
  dim_max_brightness: 100  # % brightness ceiling in daylight
  dim_low_lux: 20          # lux threshold to start dimming
  dim_high_lux: 300        # lux threshold for full brightness

audio:
  volume_start: 20         # % volume when alarm starts
  volume_max: 80           # % volume ceiling
  volume_ramp_seconds: 120 # seconds to ramp from start to max
  fallback_buzzer: true    # use buzzer if Music Assistant unavailable

buzzer:
  gpio_pin: 13             # BCM GPIO13 = PWM1, Pin 33 (no I2S/MAX98357A conflict)
  melody: "default"        # global fallback melody; overridden per-alarm
  duty_cycle: 50           # PWM duty cycle percent (0–100)

snooze:
  duration_minutes: 9

sunrise:
  ramp_minutes: 20         # global default; overridden per-alarm
  max_brightness: 255
  num_leds: 6              # number of WS2812B LEDs in the strip

dht22:
  enabled: true
  gpio_pin: 4              # BCM GPIO pin the DHT22 data line is connected to
  poll_interval_seconds: 60
  temperature_unit: "F"    # F or C

weather:
  enabled: true
  ha_condition_entity: "weather.forecast_home"
  ha_temp_entity: ""           # leave blank to use temperature from the weather entity
  refresh_interval_seconds: 300

home_assistant:
  url: "http://homeassistant.local:8123"
  dashboard_url: "http://homeassistant.local:8123/lovelace/0"  # URL shown in the dashboard iframe
  token: ""                    # Set via HA_TOKEN in .env — do not put real token here
  mqtt_broker: "homeassistant.local"
  mqtt_port: 1883
  music_player_entity: ""      # fallback entity when no zone_entity_map match is found

  # Multi-zone playback: read these input_selects at alarm fire time to pick the target player
  music_target_select: "input_select.music_target"
  playback_mode_select: "input_select.playback_mode"

  # Maps input_select.music_target option names → HA media_player entity IDs.
  # Values may be a flat entity ID string, or a dict keyed by playback_mode (Sync/WIIM/Auto).
  zone_entity_map:
    Downstairs:
      Sync: "media_player.lancerSnapcast"
      WIIM: "media_player.wiim_pro_ea7a"
      Auto: "media_player.lancerSnapcast"
    Upstairs:
      Sync: "media_player.firestarSnapcast"
      WIIM: "media_player.second_floor_wiim"
      Auto: "media_player.firestarSnapcast"
    Whole House: "media_player.lancerSnapcast"
    # Add remaining zones after identifying their HA entity IDs:
    # Kitchen: "media_player.kitchen_snapcast"
    # Living Room: "media_player.living_room_snapcast"
    # Office: "media_player.office_snapcast"
    # Dining Room: "media_player.dining_room_snapcast"
    # Main Bathroom: "media_player.main_bathroom_snapcast"
    # Aiden's Room: "media_player.aidens_room_snapcast"
    # Guest Room: "media_player.guest_room_snapcast"
    # Elizabeth's Room: "media_player.elizabeths_room_snapcast"

ota:
  git_branch: "master"
  auto_check: false
